# Multi-provider catalog example — copy values into your own
# model-providers.properties (path set by MODEL_PROVIDERS_FILE in
# service.properties). Keys stay in your secret store, never here.
#
# Provider 1: the primary OpenAI-compatible endpoint.
PROVIDER_1_ID=main
PROVIDER_1_DIALECT=OPENAI_CHAT_COMPLETIONS
PROVIDER_1_BASE_URL=https://opencode.ai/zen/go/v1
PROVIDER_1_API_KEY=${MODEL_API_KEY}
PROVIDER_1_MODEL_1_ID=glm-5.3-flash
PROVIDER_1_MODEL_1_DISPLAY=GLM 5.3 Flash
#
# Provider 2: any second OpenAI-compatible endpoint — same dialect, zero
# code. Shown with the Gemini compat surface; swap base URL for
# OpenRouter, DeepSeek, Groq, Together, etc.
PROVIDER_2_ID=gemini
PROVIDER_2_DIALECT=OPENAI_CHAT_COMPLETIONS
PROVIDER_2_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai
PROVIDER_2_API_KEY=${GEMINI_API_KEY}
PROVIDER_2_MODEL_1_ID=gemini-2.0-flash
PROVIDER_2_MODEL_1_DISPLAY=Gemini 2.0 Flash
